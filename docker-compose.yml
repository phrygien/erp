version: "3.9"

networks:
    traefik-public:
        external: true
    app-network:
        driver: bridge

volumes:
    postgres-data:
    pgadmin-data:
    kafka-data:
    redis-data:
    typesense-data:

services:
    # ------------------------------------------------------------------
    # Application PHP-FPM (Laravel + Filament)
    # ------------------------------------------------------------------
    app:
        build:
            context: .
            target: app
        image: monapp/laravel-filament:latest
        container_name: app
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ROLE: app
            DB_HOST: postgres
            DB_PORT: 5432
            RUN_MIGRATIONS: "true"
        volumes:
            - ./storage/app:/var/www/html/storage/app
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            - postgres
            - redis
        networks:
            - app-network

    # ------------------------------------------------------------------
    # Worker de queue (Laravel jobs / consumer Kafka si géré via job)
    # ------------------------------------------------------------------
    queue:
        build:
            context: .
            target: app
        image: monapp/laravel-filament:latest
        container_name: queue
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ROLE: queue
            DB_HOST: postgres
            DB_PORT: 5432
        command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
        depends_on:
            - postgres
            - redis
            - kafka
        networks:
            - app-network

    # ------------------------------------------------------------------
    # Scheduler Laravel (cron)
    # ------------------------------------------------------------------
    scheduler:
        build:
            context: .
            target: app
        image: monapp/laravel-filament:latest
        container_name: scheduler
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ROLE: scheduler
            DB_HOST: postgres
            DB_PORT: 5432
        entrypoint: ["/bin/sh", "-c"]
        command: ["while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
        depends_on:
            - postgres
        networks:
            - app-network

    # ------------------------------------------------------------------
    # Nginx (reverse proxy interne vers php-fpm, exposé via Traefik)
    # ------------------------------------------------------------------
    nginx:
        build:
            context: .
            target: nginx-runtime
        image: monapp/laravel-filament-nginx:latest
        container_name: nginx
        restart: unless-stopped
        depends_on:
            - app
        networks:
            - app-network
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.app.rule=Host(`${APP_DOMAIN}`)
            - traefik.http.routers.app.entrypoints=websecure
            - traefik.http.routers.app.tls.certresolver=letsencrypt
            - traefik.http.services.app.loadbalancer.server.port=80

    # ------------------------------------------------------------------
    # PostgreSQL avec extension pgvector
    # ------------------------------------------------------------------
    postgres:
        image: pgvector/pgvector:pg16
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        networks:
            - app-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ------------------------------------------------------------------
    # pgAdmin (administration Postgres)
    # ------------------------------------------------------------------
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
            PGADMIN_CONFIG_SERVER_MODE: "True"
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            - postgres
        networks:
            - app-network
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)
            - traefik.http.routers.pgadmin.entrypoints=websecure
            - traefik.http.routers.pgadmin.tls.certresolver=letsencrypt
            - traefik.http.services.pgadmin.loadbalancer.server.port=80

    # ------------------------------------------------------------------
    # Kafka (mode KRaft, sans Zookeeper) - broker unique
    # ------------------------------------------------------------------
    kafka:
        image: bitnami/kafka:3.7
        container_name: kafka
        restart: unless-stopped
        environment:
            KAFKA_CFG_NODE_ID: 0
            KAFKA_CFG_PROCESS_ROLES: controller,broker
            KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
            ALLOW_PLAINTEXT_LISTENER: "yes"
        volumes:
            - kafka-data:/bitnami/kafka
        networks:
            - app-network
        healthcheck:
            test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
            interval: 15s
            timeout: 10s
            retries: 5

    # ------------------------------------------------------------------
    # Kafka UI (optionnel mais pratique pour visualiser topics/messages)
    # ------------------------------------------------------------------
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        restart: unless-stopped
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        depends_on:
            - kafka
        networks:
            - app-network
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.kafka-ui.rule=Host(`${KAFKA_UI_DOMAIN}`)
            - traefik.http.routers.kafka-ui.entrypoints=websecure
            - traefik.http.routers.kafka-ui.tls.certresolver=letsencrypt
            - traefik.http.services.kafka-ui.loadbalancer.server.port=8080

    # ------------------------------------------------------------------
    # Redis (cache, sessions, queue driver)
    # ------------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
        volumes:
            - redis-data:/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ------------------------------------------------------------------
    # Typesense (moteur de recherche, ex: pour Laravel Scout)
    # ------------------------------------------------------------------
    typesense:
        image: typesense/typesense:27.1
        container_name: typesense
        restart: unless-stopped
        environment:
            TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
            TYPESENSE_DATA_DIR: /data
            TYPESENSE_ENABLE_CORS: "true"
        volumes:
            - typesense-data:/data
        networks:
            - app-network
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.typesense.rule=Host(`${TYPESENSE_DOMAIN}`)
            - traefik.http.routers.typesense.entrypoints=websecure
            - traefik.http.routers.typesense.tls.certresolver=letsencrypt
            - traefik.http.services.typesense.loadbalancer.server.port=8108
